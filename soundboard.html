<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bookmarklet Soundboard — Single File</title>
  <style>
    :root{--bg:#0f1720;--card:#0b1220;--muted:#9aa4b2;--accent:#06b6d4;--danger:#ef4444}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    body{background:linear-gradient(180deg,#071023 0%, #071627 100%);color:#e6eef6;padding:20px;box-sizing:border-box}
    .wrap{max-width:980px;margin:0 auto}
    header{display:flex;align-items:center;gap:16px}
    h1{margin:0;font-size:20px}
    p.lead{margin:4px 0 18px;color:var(--muted)}

    .uploader{background:rgba(255,255,255,0.02);padding:14px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .uploader input[type=file]{display:none}
    .drop{flex:1;min-width:220px;padding:12px;border-radius:6px;border:2px dashed rgba(255,255,255,0.03);text-align:center;background:transparent;color:var(--muted);cursor:pointer}
    .controls{display:flex;gap:8px;align-items:center}
    .btn{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.02));color:#e6eef6;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
    .btn.ghost{background:transparent;border:1px dashed rgba(255,255,255,0.03)}
    .btn.danger{background:linear-gradient(180deg,#7b1111,#a11);border-color:rgba(255,255,255,0.02)}

    .board{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .card{background:var(--card);padding:10px;border-radius:8px;position:relative;border:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:8px;align-items:stretch}
    .card .name{font-weight:600;color:#e6eef6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card .meta{font-size:12px;color:var(--muted)}
    .card button.play{flex:1;padding:10px;border-radius:6px;border:none;background:linear-gradient(90deg,var(--accent),#3b82f6);color:#042027;font-weight:700;cursor:pointer}
    .card .actions{display:flex;gap:6px}
    .tiny{font-size:12px;padding:6px 8px;border-radius:6px}

    .row{display:flex;gap:8px;align-items:center}
    .small{font-size:13px;color:var(--muted)}
    .empty{margin-top:20px;color:var(--muted);text-align:center}

    footer{margin-top:18px;color:var(--muted);font-size:13px}
    .search{margin-left:auto}

    label.input{display:flex;flex-direction:column;gap:6px}
    input[type=text], input[type=password]{padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:inherit}

    .progress{height:6px;background:rgba(255,255,255,0.02);border-radius:6px;overflow:hidden}
    .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6);width:0}

    .note{font-size:13px;color:var(--muted)}
    .muted{color:var(--muted)}
    .badge{font-size:12px;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03)}

    @media (max-width:520px){.uploader{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Bookmarklet Soundboard</h1>
        <p class="lead">Upload audio, name the buttons, and store them locally or push them to the repo automatically via Cloudflare Worker.</p>
      </div>
    </header>

    <section class="uploader" aria-label="upload">
      <label class="drop" id="dropZone">Drop audio here or click to choose files
        <input id="fileInput" type="file" accept="audio/*" multiple>
      </label>

      <div style="min-width:220px;flex:0 0 260px">
        <label class="input">
          <span class="small">Default name for incoming files (leave empty to use filename)</span>
          <input type="text" id="defaultName" placeholder="e.g. clap, snare, laugh">
        </label>
      </div>

      <div style="min-width:260px;flex:0 0 360px">
        <label class="input">
          <span class="small">Cloudflare Worker URL (optional) — if set, uploads go through your Worker and users do not need GitHub tokens.</span>
          <input type="text" id="uploaderUrl" placeholder="https://your-worker.example.workers.dev">
        </label>
        <label class="input" style="margin-top:6px">
          <span class="small">Upload key (enter once) — if your Worker requires a shared key, paste it here. Saved locally.</span>
          <input type="text" id="uploadKeyField" placeholder="Paste upload key (optional)">
        </label>
      </div>

      <div style="min-width:260px;flex:0 0 320px">
        <label class="input">
          <span class="small">GitHub token (session-only). If Worker is not configured, you can paste a token here to upload directly to the repo.</span>
          <input type="password" id="ghToken" placeholder="Paste GitHub token (public_repo) here">
        </label>
      </div>

      <div class="controls">
        <button class="btn" id="addFilesBtn">Add selected</button>
        <button class="btn ghost" id="uploadAllBtn">Upload all (Worker if set, otherwise GitHub token)</button>
        <button class="btn ghost" id="exportBtn">Export JSON</button>
        <button class="btn danger" id="clearAllBtn">Clear all</button>
      </div>
    </section>

    <div id="progressContainer" style="margin-top:10px"></div>

    <main class="board" id="board" aria-live="polite"></main>

    <div class="empty" id="emptyState">No sounds yet — add some via the uploader above.</div>

    <footer>
      <div class="row">
        <div class="note">Stored in localStorage under key: <code id="storageKey"></code></div>
      </div>
    </footer>
  </div>

  <script>
    (function(){
      // Fixed repo configuration (no other choice when using direct GH token)
      const GITHUB_OWNER = 'ToasterGG';
      const GITHUB_REPO = 'bookmarklet-soundboard';
      const GITHUB_BRANCH = 'main';
      const GITHUB_FOLDER = 'sounds';

      const STORAGE_KEY = 'bookmarklet-soundboard:sounds:v1';
      const UPLOAD_KEY_STORAGE = 'bookmarklet-soundboard:upload_key';
      const UPLOADER_URL_STORAGE = 'bookmarklet-soundboard:uploader_url';
      document.getElementById('storageKey').textContent = STORAGE_KEY;

      // session token only (not persisted)
      let sessionToken = '';

      let sounds = loadSounds();
      const board = document.getElementById('board');
      const emptyState = document.getElementById('emptyState');
      const fileInput = document.getElementById('fileInput');
      const dropZone = document.getElementById('dropZone');
      const defaultNameInput = document.getElementById('defaultName');
      const addFilesBtn = document.getElementById('addFilesBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const exportBtn = document.getElementById('exportBtn');
      const uploadAllBtn = document.getElementById('uploadAllBtn');
      const tokenInput = document.getElementById('ghToken');
      const uploaderUrlInput = document.getElementById('uploaderUrl');
      const uploadKeyField = document.getElementById('uploadKeyField');
      const progressContainer = document.getElementById('progressContainer');

      // load saved uploader config
      const savedUploadKey = localStorage.getItem(UPLOAD_KEY_STORAGE) || '';
      const savedUploaderUrl = localStorage.getItem(UPLOADER_URL_STORAGE) || '';
      uploadKeyField.value = savedUploadKey;
      uploaderUrlInput.value = savedUploaderUrl;

      tokenInput.addEventListener('input', ()=>{ sessionToken = tokenInput.value.trim(); });
      uploaderUrlInput.addEventListener('input', ()=>{ localStorage.setItem(UPLOADER_URL_STORAGE, uploaderUrlInput.value.trim()); });
      uploadKeyField.addEventListener('input', ()=>{ localStorage.setItem(UPLOAD_KEY_STORAGE, uploadKeyField.value.trim()); });

      renderBoard();

      dropZone.addEventListener('click', ()=> fileInput.click());
      dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.style.borderColor = 'rgba(255,255,255,0.12)'; });
      dropZone.addEventListener('dragleave', ()=>{ dropZone.style.borderColor = ''; });
      dropZone.addEventListener('drop', (e)=>{ e.preventDefault(); dropZone.style.borderColor = ''; handleFiles(e.dataTransfer.files); });

      fileInput.addEventListener('change', ()=>{ /* do nothing until Add selected clicked */ });
      addFilesBtn.addEventListener('click', ()=>{ handleFiles(fileInput.files); fileInput.value = ''; });

      clearAllBtn.addEventListener('click', ()=>{
        if(!confirm('Remove all saved sounds from localStorage? This cannot be undone.')) return;
        sounds = [];
        saveSounds();
        renderBoard();
      });

      exportBtn.addEventListener('click', ()=>{
        const blob = new Blob([JSON.stringify(sounds, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'soundboard-export.json'; a.click();
        setTimeout(()=>URL.revokeObjectURL(url), 3000);
      });

      uploadAllBtn.addEventListener('click', async ()=>{
        const uploaderUrl = (localStorage.getItem(UPLOADER_URL_STORAGE) || '').trim();
        const uploadKey = (localStorage.getItem(UPLOAD_KEY_STORAGE) || '').trim();
        const candidates = sounds.filter(s => typeof s.dataURL === 'string' && s.dataURL.startsWith('data:'));
        if(candidates.length===0){ alert('No local sounds to upload (already uploaded or remote).'); return; }
        if(uploaderUrl){
          if(!confirm('Upload '+candidates.length+' sound(s) to your repo via the configured Worker?')) return;
          for(let i=0;i<candidates.length;i++){
            const s = candidates[i];
            showProgress('Uploading '+(i+1)+' / '+candidates.length+': '+s.filename);
            try{ const res = await uploadViaWorker(uploaderUrl, s, uploadKey); s.dataURL = res.rawUrl; s.remoteUrl = res.rawUrl; s.remotePath = res.path; s.uploadedAt = Date.now(); saveSounds(); renderBoard(); }
            catch(e){ alert('Upload failed for '+s.filename+': '+e.message); break; }
          }
          hideProgress();
        }else{
          if(!sessionToken){ alert('Please paste a GitHub token in the token field (session-only) or set a Worker URL.'); tokenInput.focus(); return; }
          if(!confirm('Upload '+candidates.length+' sound(s) directly to the repo with your token?')) return;
          for(let i=0;i<candidates.length;i++){
            const s = candidates[i];
            showProgress('Uploading '+(i+1)+' / '+candidates.length+': '+s.filename);
            try{ await uploadSoundToRepoGH(s); saveSounds(); renderBoard(); }
            catch(e){ alert('Upload failed for '+s.filename+': '+e.message); break; }
          }
          hideProgress();
        }
      });

      function handleFiles(fileList){
        if(!fileList || fileList.length===0) return;
        const files = Array.from(fileList);
        showProgress('Preparing to add '+files.length+' file(s)...');
        // sequentially read to update progress
        let idx = 0;
        (function next(){
          const file = files[idx++];
          const suggested = defaultNameInput.value.trim() || file.name.replace(/\.[^.]+$/, '');
          if(file.size > 50*1024*1024){
            if(!confirm(file.name + ' is large ('+Math.round(file.size/1024)+' KB). Storing it may fail due to limits. Continue?')){ done(); return; }
          }
          const reader = new FileReader();
          reader.onload = (ev)=>{
            addSoundObject({name: suggested || file.name, filename: file.name, dataURL: ev.target.result, mime: file.type, size: file.size});
            showProgress('Added '+file.name+' ('+Math.round(file.size/1024)+' KB)');
            if(idx < files.length) setTimeout(next, 150);
            else done();
          };
          reader.onerror = ()=>{ alert('Failed to read '+file.name); if(idx < files.length) next(); else done(); };
          reader.readAsDataURL(file);
        })();

        function done(){
          setTimeout(()=>{ hideProgress(); renderBoard(); }, 400);
        }
      }

      function addSoundObject(obj){
        const id = 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
        const sound = { id, name: obj.name || obj.filename || 'sound', filename: obj.filename||'', dataURL: obj.dataURL, mime: obj.mime||'', size: obj.size||(obj.dataURL?Math.ceil(obj.dataURL.length*3/4):0), createdAt: Date.now() };
        sounds.push(sound);
        try{ saveSounds(); }catch(e){ alert('Saving to localStorage failed: ' + e.message); }
      }

      function playSound(id){
        const s = sounds.find(x=>x.id===id); if(!s) return;
        try{
          const src = s.dataURL;
          const a = new Audio(src);
          a.play().catch(e=>{ alert('Playback failed: '+e.message) });
        }catch(e){ alert('Playback error: '+e.message) }
      }

      function renameSound(id){
        const s = sounds.find(x=>x.id===id); if(!s) return;
        const nv = prompt('Rename sound', s.name); if(nv===null) return; s.name = nv.trim() || s.name; saveSounds(); renderBoard();
      }

      function deleteSound(id){
        if(!confirm('Delete this sound?')) return;
        sounds = sounds.filter(x=>x.id!==id); saveSounds(); renderBoard();
      }

      // Upload via Cloudflare Worker (uploaderUrl) - accepts JSON { filename, dataURL }
      async function uploadViaWorker(uploaderUrl, sound, uploadKey){
        if(!uploaderUrl) throw new Error('No uploader URL configured');
        // send JSON with dataURL to avoid re-reading original file
        const payload = { filename: sound.filename || sound.name, dataURL: sound.dataURL };
        const headers = { 'Content-Type': 'application/json' };
        if(uploadKey) headers['x-upload-key'] = uploadKey;
        const res = await fetch(uploaderUrl, { method: 'POST', headers, body: JSON.stringify(payload) });
        const json = await res.json();
        if(!res.ok) throw new Error((json && json.error) ? (json.error + (json.message ? ': '+json.message : '')) : res.statusText);
        if(!json.success) throw new Error('Upload failed: ' + JSON.stringify(json));
        return json; // { success:true, rawUrl, path }
      }

      // Upload directly to GitHub via token (fallback)
      async function uploadSoundToRepoGH(sound){
        if(!sessionToken) throw new Error('No GitHub token in session');
        if(!sound || !sound.dataURL || !sound.dataURL.startsWith('data:')) throw new Error('Sound has no local data to upload');

        const comma = sound.dataURL.indexOf(',');
        const b64 = sound.dataURL.substring(comma+1);
        const ext = detectExtensionFromMimeOrFilename(sound.mime, sound.filename) || 'bin';
        const safeName = sanitizeFilename(sound.filename || sound.name) || ('sound-' + Date.now());
        const filename = Date.now().toString(36) + '-' + safeName + (safeName.endsWith('.'+ext) ? '' : ('.'+ext));
        const path = (GITHUB_FOLDER ? GITHUB_FOLDER + '/' : '') + filename;

        const url = 'https://api.github.com/repos/' + encodeURIComponent(GITHUB_OWNER) + '/' + encodeURIComponent(GITHUB_REPO) + '/contents/' + encodeURIComponent(path);
        const body = { message: 'Add sound ' + sound.name, content: b64, branch: GITHUB_BRANCH };

        const res = await fetch(url, { method:'PUT', headers: { 'Authorization': 'token ' + sessionToken, 'Content-Type':'application/json', 'Accept':'application/vnd.github.v3+json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if(!res.ok) {
          const msg = (data && data.message) ? data.message : ('HTTP '+res.status);
          throw new Error(msg);
        }

        const rawUrl = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + GITHUB_BRANCH + '/' + path;
        sound.dataURL = rawUrl;
        sound.remotePath = path;
        sound.remoteUrl = rawUrl;
        sound.uploadedAt = Date.now();
      }

      function detectExtensionFromMimeOrFilename(mime, filename){
        if(filename){ const m = filename.match(/\.([a-z0-9]+)$/i); if(m) return m[1].toLowerCase(); }
        if(!mime) return null;
        if(mime.includes('mpeg')||mime.includes('mp3')) return 'mp3';
        if(mime.includes('wav')) return 'wav';
        if(mime.includes('ogg')) return 'ogg';
        if(mime.includes('webm')) return 'webm';
        if(mime.includes('aac')) return 'aac';
        return null;
      }

      function sanitizeFilename(name){
        if(!name) return '';
        name = name.split('/').pop().split('\\').pop();
        name = name.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-_.]/g,'');
        if(name.length>64) name = name.slice(0,64);
        return name;
      }

      function saveSounds(){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(sounds)); }
        catch(e){ throw e; }
      }

      function loadSounds(){
        try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
        catch(e){ console.error('Failed to load sounds', e); return []; }
      }

      function renderBoard(){
        board.innerHTML = '';
        if(!sounds || sounds.length===0){ emptyState.style.display = 'block'; return; } else emptyState.style.display = 'none';
        sounds.forEach(s=>{
          const card = document.createElement('div'); card.className='card';
          const name = document.createElement('div'); name.className='name'; name.title = s.name; name.textContent = s.name;
          const meta = document.createElement('div'); meta.className='meta';
          const metaText = (s.remoteUrl ? s.remoteUrl : (s.filename ? s.filename + ' • ' + readableSize(s.size) : readableSize(s.size)));
          meta.textContent = metaText;

          const play = document.createElement('button'); play.className='play'; play.textContent = 'Play'; play.addEventListener('click', ()=> playSound(s.id));

          const actions = document.createElement('div'); actions.className='actions';
          const rename = document.createElement('button'); rename.className='tiny btn'; rename.textContent='Rename'; rename.addEventListener('click', ()=> renameSound(s.id));
          const dl = document.createElement('a'); dl.className='tiny btn'; dl.textContent='Download'; dl.href = s.dataURL; dl.download = s.filename || (s.name + '.bin');
          const del = document.createElement('button'); del.className='tiny btn'; del.textContent='Delete'; del.style.background='transparent'; del.style.border='1px solid rgba(255,255,255,0.04)'; del.addEventListener('click', ()=> deleteSound(s.id));

          actions.appendChild(rename);

          // Upload button shown only if local data URL
          if(typeof s.dataURL === 'string' && s.dataURL.startsWith('data:')){
            const up = document.createElement('button'); up.className='tiny btn'; up.textContent='Upload'; up.addEventListener('click', async ()=>{
              const uploaderUrl = (localStorage.getItem(UPLOADER_URL_STORAGE) || '').trim();
              const uploadKey = (localStorage.getItem(UPLOAD_KEY_STORAGE) || '').trim();
              if(uploaderUrl){
                showProgress('Uploading ' + (s.filename || s.name) + '...');
                try{ const res = await uploadViaWorker(uploaderUrl, s, uploadKey); s.dataURL = res.rawUrl; s.remoteUrl = res.rawUrl; s.remotePath = res.path; s.uploadedAt = Date.now(); saveSounds(); renderBoard(); hideProgress(); alert('Uploaded to repo: ' + s.remoteUrl); }
                catch(e){ hideProgress(); alert('Upload failed: ' + e.message); }
              }else{
                if(!sessionToken){ alert('Please paste a GitHub token in the token field (session-only) or set a Worker URL.'); tokenInput.focus(); return; }
                showProgress('Uploading ' + (s.filename || s.name) + ' to GitHub...');
                try{ await uploadSoundToRepoGH(s); saveSounds(); renderBoard(); hideProgress(); alert('Uploaded to repo: ' + s.remoteUrl); }
                catch(e){ hideProgress(); alert('Upload failed: ' + e.message); }
              }
            });
            actions.appendChild(up);
          }else if(s.remoteUrl){
            const badge = document.createElement('span'); badge.className='badge muted'; badge.textContent='In repo'; actions.appendChild(badge);
          }

          actions.appendChild(dl);
          actions.appendChild(del);

          card.appendChild(name); card.appendChild(meta); card.appendChild(play); card.appendChild(actions);
          board.appendChild(card);
        });
      }

      function readableSize(n){ if(!n && n!==0) return ''; if(n<1024) return n+' B'; if(n<1024*1024) return Math.round(n/1024)+' KB'; return Math.round(n/1024/1024*10)/10+' MB'; }

      function showProgress(text){ progressContainer.innerHTML = '<div class="progress"><i style="width:60%"></i></div><div class="small" style="margin-top:6px">'+escapeHtml(text)+'</div>'; }
      function hideProgress(){ progressContainer.innerHTML = ''; }
      function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      // Expose small API for console debugging
      window.__soundboard = { sounds, saveSounds, loadSounds, playSound };

    })();
  </script>
</body>
</html>
